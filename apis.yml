name: YouStake
description: YouStake is a peer-to-peer sports staking and sponsorship marketplace, founded in 2013,
  that lets fans invest in skilled poker and esports players in exchange for a share of their tournament
  winnings. Players list their buy-ins and backers can stake them for as little as $20, structured as a
  person-to-person sponsorship agreement rather than gambling. The consumer platform has since rebranded
  and now operates as StakeKings (youstake.com redirects to stakekings.com), which also offers white-label
  staking-marketplace software to partners. It is a business-to-consumer web application with no public
  API, developer portal, SDKs, or published API documentation.
